# Edge Function for the Ctrl+Click contact form.
# The site is GitHub Pages, which cannot run this file.
# Rebuild the bundled handler, then deploy:
#   npm run build:fn
#   supabase functions deploy contact
# Visitors are anonymous, so the platform JWT check stays off.
# The handler still drops honeypots, caps field length, and rate-limits.

[functions.contact]
verify_jwt = false
