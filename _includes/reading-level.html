<!-- Audience control, shared by reference pages (services, glossary, FAQ,
     email settings, stories). Same three choices as the homepage:
     Individual, Team, and the just-for-fun command line. Guides themselves
     stay readable either way — the choice is remembered for the home page.
     Behavior is wired in assets/level.js. -->
<div class="level-switch" id="levelSwitch">
  <span class="level-label">Who it's for</span>
  <div class="level-seg" role="group" aria-label="Choose who this site is speaking to">
    <button type="button" class="level-btn" data-level="individual" aria-pressed="false" title="One person — your own work, devices, and learning AI at your pace">Individual</button>
    <button type="button" class="level-btn is-active" data-level="team" aria-pressed="true" title="A business, nonprofit, or household. Teams and families welcome.">Team</button>
    <button type="button" class="level-btn" data-level="expert" aria-pressed="false" title="Just for fun: a command-line Easter egg, not a service we sell">⌃ Expert</button>
  </div>
</div>
