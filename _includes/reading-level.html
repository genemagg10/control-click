<div class="level-switch" id="levelSwitch">
  <span class="level-label">Detail level</span>
  <div class="level-seg" role="group" aria-label="How much detail the site shows">
    <button type="button" class="level-btn" data-level="beginner" aria-pressed="true" title="Plain and simple (default)">Beginner</button>
    <button type="button" class="level-btn" data-level="intermediate" aria-pressed="false" title="Shows the how and the tools on each service">Intermediate</button>
    <button type="button" class="level-btn" data-level="expert" aria-pressed="false" title="The command-line view of the whole site">⌃ Expert</button>
  </div>
</div>
