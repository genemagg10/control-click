# Ctrl+Click: Jekyll config for GitHub Pages
# index.html carries (empty) front matter so Jekyll renders its service cards
# from the _services collection with Liquid.

title: "Ctrl+Click: AI & IT Solutions"
tagline: Technology Consulting & Support
description: >-
  Notes from ⌃click on AI adoption, secure networking, email migrations,
  cloud infrastructure, and everyday tech, for people, businesses, and their teams
  in the Bay Area.
# url and baseurl are intentionally absent: the GitHub Pages build fills both
# in from the live Pages settings (project path now, custom domain when one is
# configured), but only when the keys are unset, so don't add them here.
author:
  name: ⌃click

timezone: America/Los_Angeles
markdown: kramdown

permalink: /blog/:title/

# Each service is one file in _services/, rendered both as a homepage card and
# as its own page at /services/<slug>/. Single source of truth.
collections:
  services:
    output: true
    permalink: /services/:name/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  posts_limit: 20

# Every post is automatically laid out and bylined. A new post only needs
# a title line at the top of its markdown file.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: ⌃click

# Native contact form. GitHub Pages is static, so the live page posts to the
# Supabase Edge Function URL once it is deployed. Leave endpoint blank until
# then: localhost posts to the mock at http://127.0.0.1:8787/contact
# (node scripts/mock-contact-server.js), which records mail and does not send.
# Anywhere else, a blank endpoint asks the visitor to call.
# The function reads RESEND_API_KEY, CONTACT_FROM_EMAIL, and CONTACT_TO_EMAIL.
# Those are not set here. The page never sees them.
contact_form:
  endpoint: ""

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs        # internal planning docs; not part of the built site
  - scripts     # local mock mailer and tests; not part of the built site
  - supabase    # Edge Function source; Pages does not run it
