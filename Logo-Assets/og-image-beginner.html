<!DOCTYPE html>
<!--
  Ctrl+Click social card (og-image) — BEGINNER level — 1200×630.
  For the individual / family / small-business audience. Same warm, light
  human-mode ground as the intermediate card; the headline is the
  individual message ("works for you, not instead of you"). Render to
  /og-image-beginner.png with headless Chromium:

    (viewport 1200×630, wait for document.fonts.ready, screenshot)

  Keep it light and human-first. Do not revert to a dark, price-led card.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" />
<style>
  :root {
    --navy: #0E1626;
    --bg: #F2F5F7;
    --panel: #FFFFFF;
    --muted: #5C6B7E;
    --ink-soft: #3D4A5C;
    --text: #0E1626;
    --line: #D9E1E7;
    --teal: #146E63;
    --teal-bright: #1E9C8C;
    --coral: #E8674C;
    --coral-deep: #C7492F;
    --font-brand: "Archivo", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: var(--font-brand);
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 12% -20%, rgba(30, 156, 140, 0.14), transparent),
      radial-gradient(1000px 620px at 92% 4%, rgba(47, 188, 169, 0.10), transparent),
      radial-gradient(900px 560px at 60% 118%, rgba(232, 103, 76, 0.10), transparent),
      var(--bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 76px 84px;
    position: relative;
    overflow: hidden;
  }

  /* wordmark row */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0;
    font-family: var(--font-brand); font-weight: 800;
    font-size: 66px; letter-spacing: -1.5px; line-height: 1;
  }
  .wm-caret { width: 50px; height: 38px; flex-shrink: 0; margin-right: 16px; }
  .wm-ctrl { color: var(--text); }
  .wm-click { color: var(--teal-bright); }
  .brand-suffix {
    font-family: var(--font-mono); font-size: 20px; font-weight: 500;
    letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
    margin-left: 20px; padding-bottom: 4px;
  }
  .brandline { display: flex; align-items: flex-end; gap: 0; margin-bottom: 30px; }

  .formerly {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 8px 16px; border-radius: 999px; font-size: 17px; letter-spacing: .3px;
    border: 1px solid var(--line); color: var(--muted);
    background: rgba(255,255,255,.6);
    font-family: var(--font-brand); font-weight: 500;
    margin-bottom: 26px;
  }
  .formerly b { color: var(--text); font-weight: 600; }
  .formerly .car { color: var(--teal); font-weight: 700; }

  h1 {
    font-size: 74px; line-height: 1.02; letter-spacing: -2px;
    font-weight: 800; max-width: 15ch; margin-bottom: 30px;
  }
  .grad {
    background: linear-gradient(90deg, var(--teal), var(--teal-bright));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .trust-row {
    display: flex; align-items: center; gap: 26px;
    font-size: 24px; color: var(--ink-soft); font-weight: 600;
  }
  .trust-row span { display: inline-flex; align-items: center; gap: 10px; }
  .trust-row svg { flex-shrink: 0; }

  /* faint oversized keycap watermark, bottom-right */
  .watermark {
    position: absolute; right: -70px; bottom: -110px;
    width: 460px; height: 460px; opacity: .06; transform: rotate(-8deg);
  }
</style>
</head>
<body>
  <svg class="watermark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="28" y="25" width="68" height="68" rx="21" fill="#1E9C8C"/>
    <rect x="19" y="17" width="68" height="68" rx="21" fill="#0E1626"/>
    <path d="M38 56 L53 42 L68 56" fill="none" stroke="#1E9C8C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="brandline">
    <span class="wordmark" aria-hidden="true">
      <svg class="wm-caret" viewBox="0 0 40 28" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 23 L20 8 L35 23" stroke="#1E9C8C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="wm-ctrl">Ctrl+</span><span class="wm-click">Click</span>
    </span>
    <span class="brand-suffix">AI &amp; IT Solutions</span>
  </div>

  <div>
    <span class="formerly"><span class="car" aria-hidden="true">⌃</span> formerly <b>Maggio Consulting</b></span>
  </div>

  <h1>AI That Works for You. <span class="grad">Not Instead of You.</span></h1>

  <div class="trust-row">
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E9C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>No jargon</span>
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E9C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>No judgment</span>
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E9C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>No mystery boxes</span>
  </div>
</body>
</html>
