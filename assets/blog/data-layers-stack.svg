<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="Stack separating replaceable AI tools from user-owned durable data">
  <rect width="880" height="420" fill="#0f172a"/>
  <text x="40" y="40" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Separate the workers from the memory</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="80" y="70" width="720" height="58" rx="12" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <text x="440" y="95" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">Models &amp; harnesses — replaceable workers</text>
    <text x="440" y="115" text-anchor="middle" fill="#e2e8f0" font-size="12">ChatGPT · Claude · Grok Bot · Clawdbot · whatever comes next</text>

    <rect x="80" y="142" width="720" height="50" rx="12" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
    <text x="440" y="172" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="700">Selective projections — only what a tool needs, for as long as it needs it</text>

    <rect x="80" y="206" width="720" height="50" rx="12" fill="#14532d" stroke="#34d399" stroke-width="2"/>
    <text x="440" y="236" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">Git history — accountability, diffs, recovery</text>

    <rect x="80" y="270" width="720" height="58" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="440" y="295" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="700">Durable files you can read — Markdown · YAML · JSON</text>
    <text x="440" y="315" text-anchor="middle" fill="#e2e8f0" font-size="12">Meaning for humans · structure for automation</text>

    <rect x="80" y="342" width="720" height="50" rx="12" fill="#422006" stroke="#fb923c" stroke-width="2"/>
    <text x="440" y="372" text-anchor="middle" fill="#fdba74" font-size="14" font-weight="700">Protected raw sources — journals, transcripts, imports (expose carefully)</text>
  </g>
</svg>
