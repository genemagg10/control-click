<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Four phases of AI memory: App, Repo, Harness, User-owned data layer">
  <rect width="960" height="280" fill="#0f172a"/>
  <text x="40" y="42" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Where AI memory has lived</text>
  <!-- boxes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="70" width="190" height="140" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="135" y="110" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">1. App memory</text>
    <text x="135" y="140" text-anchor="middle" fill="#e2e8f0" font-size="13">Chat history</text>
    <text x="135" y="162" text-anchor="middle" fill="#e2e8f0" font-size="13">Account prefs</text>
    <text x="135" y="184" text-anchor="middle" fill="#94a3b8" font-size="12">Locked to one UI</text>

    <path d="M240 140 L268 140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="270" y="70" width="190" height="140" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="365" y="110" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">2. Repo memory</text>
    <text x="365" y="140" text-anchor="middle" fill="#e2e8f0" font-size="13">Files + git</text>
    <text x="365" y="162" text-anchor="middle" fill="#e2e8f0" font-size="13">Portable context</text>
    <text x="365" y="184" text-anchor="middle" fill="#94a3b8" font-size="12">Model-agnostic</text>

    <path d="M470 140 L498 140" stroke="#64748b" stroke-width="2"/>

    <rect x="500" y="70" width="190" height="140" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="595" y="110" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">3. Harness memory</text>
    <text x="595" y="140" text-anchor="middle" fill="#e2e8f0" font-size="13">Tools + skills</text>
    <text x="595" y="162" text-anchor="middle" fill="#e2e8f0" font-size="13">Multi-agent env</text>
    <text x="595" y="184" text-anchor="middle" fill="#94a3b8" font-size="12">Don't re-trap here</text>

    <path d="M700 140 L728 140" stroke="#64748b" stroke-width="2"/>

    <rect x="730" y="70" width="190" height="140" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="825" y="110" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">4. Your data layer</text>
    <text x="825" y="140" text-anchor="middle" fill="#e2e8f0" font-size="13">Owned by you</text>
    <text x="825" y="162" text-anchor="middle" fill="#e2e8f0" font-size="13">Borrowed by AI</text>
    <text x="825" y="184" text-anchor="middle" fill="#94a3b8" font-size="12">Continuity travels</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
