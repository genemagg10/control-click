  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/brand/favicon-32.png' | relative_url }}" />

  {% seo %}

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=VT323&display=swap" />
  <link rel="stylesheet" href="{{ '/assets/expert-mode.css' | relative_url }}?v=8" />
  <!-- Expert mode is opt-in and remembered per browser. Apply the class before
       first paint so a returning visitor never sees a flash of the normal site.
       `cli-full` turns the page into a full-screen terminal on every page (not
       just the landing page): the rich HTML content steps aside and its copy is
       rendered as terminal text by expert-mode.js. -->
  <script>try{var d=document.documentElement;if(localStorage.getItem('ctrlclick:level')==='intermediate'){d.classList.add('intermediate');}if(localStorage.getItem('ctrlclick:expert')==='on'){d.classList.add('expert');d.classList.add('cli-full');}}catch(e){}</script>

          async src="https://gc.zgo.at/count.js"></script>
